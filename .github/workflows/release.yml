name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v4.7.2-mewc.1)'
        required: true
        type: string

permissions:
  contents: write   # needed to upload artifacts to the GitHub Release

jobs:
  # --------------------------------------------------------------------------
  # Linux AppImage — uses contrib/build-linux/appimage/, Docker-based.
  # make_type2_runtime.sh now downloads the pre-built runtime-x86_64 from the
  # AppImage `continuous` release instead of compiling it inside an Alpine
  # container with stale package pins.
  # --------------------------------------------------------------------------
  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Build AppImage
        run: ./contrib/build-linux/appimage/build.sh

      - name: List artifacts
        run: ls -la dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          # build.sh writes to $PROJECT_ROOT/dist (not contrib/.../dist as the
          # path string in build.sh suggests — that's `../../../dist` after
          # normalization). Glob the real output dir.
          path: dist/*.AppImage

  # --------------------------------------------------------------------------
  # Linux source tarball (sdist) — pure Python, fast
  # --------------------------------------------------------------------------
  linux-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Build sdist
        run: |
          ./contrib/build-linux/sdist/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-sdist
          path: dist/*

  # --------------------------------------------------------------------------
  # Windows installer (PyInstaller + NSIS via Wine in Docker)
  # --------------------------------------------------------------------------
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Build Windows exe (Wine in Docker)
        run: |
          ./contrib/build-wine/build.sh

      - name: List artifacts
        run: ls -la contrib/build-wine/dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: contrib/build-wine/dist/*

  # --------------------------------------------------------------------------
  # macOS .dmg — DISABLED for the current release line.
  #
  # Long debugging trail (v1..v9) summary, in order of issue uncovered:
  #   v1-4:  libzbar from-source link failure on macos-latest arm64
  #          → fixed with `brew install zbar` in make_osx.sh
  #   v5:    frozenlist's PEP 517 backend imports a non-existent symbol
  #          from Cython.Build.Cythonize via suppress(ImportError)
  #          → fixed with FROZENLIST_NO_EXTENSIONS=1
  #   v7:    requirements-hw.txt install hits Cython arch mismatch
  #          → fixed by skipping (HW plugins disabled at loader level)
  #   v8:    PyInstaller copy_metadata('slip10') failed (slip10 not installed)
  #          → fixed by commenting out hw-related metadata copies
  #   v9:    macos-latest had x86_64 wheel / arm64 process arch mismatch.
  #          Switched to macos-13 (Intel) — but the macos-13 runner pool
  #          on GitHub Actions is exhausted (jobs queue 2+ hours with no
  #          runner assigned), and macos-13 has been deprecated.
  #
  # Path forward documented in docs/PORT_NOTES.md: needs either a
  # self-hosted arm64 runner (Meowcoin Foundation infrastructure) or a
  # rewrite of make_osx.sh to use the macos-14 runner's pre-installed
  # arm64 Python instead of the python.org universal2 pkg installer.
  # macos:
  #   runs-on: macos-14
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: ./contrib/osx/make_osx.sh
  #     - uses: actions/upload-artifact@v4
  #       with: { name: macos, path: dist/*.dmg }

  # --------------------------------------------------------------------------
  # Android APK (buildozer + Android SDK via Docker)
  #
  # Cold first run takes ~4-5h (downloads ~5 GB Android SDK + NDK, then
  # cross-compiles CPython + libffi + openssl + sqlite + libsecp256k1 + Qt6
  # + PyQt6 for each ABI). Caching .buildozer/ + .buildozer_qml/ between
  # runs cuts subsequent runs to ~15 min. Cache key includes the spec hash
  # + p4a recipes hash so any toolchain bump invalidates cleanly.
  # --------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Cache buildozer toolchain + cross-compiled deps
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            .buildozer_qml
          key: buildozer-${{ runner.os }}-${{ hashFiles('contrib/android/buildozer_qml.spec', 'contrib/android/p4a_recipes/**', 'contrib/android/Dockerfile') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build Android APK
        # `all` loops armeabi-v7a + arm64-v8a + x86_64 (3 cold cross-compiles
        # of CPython + Qt6 + PyQt6) which exceeds GitHub's 6h job cap. Pick
        # one ABI; arm64-v8a covers all modern 64-bit Android phones. Once
        # actions/cache@v4 has a warm tree we can switch back to `all`.
        run: ./contrib/android/build.sh qml arm64-v8a release-unsigned

      - name: List artifacts
        run: ls -la dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  # --------------------------------------------------------------------------
  # Aggregate: download all platform artifacts and attach to the GitHub Release.
  # Skips platforms whose build job failed so a single-platform failure doesn't
  # block uploading the others.
  # --------------------------------------------------------------------------
  release-upload:
    needs: [linux-appimage, linux-sdist, windows, android]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Flatten + checksum
        run: |
          mkdir -p release-files
          # Only release the actual installer / archive artifacts, not every
          # file that happens to live under one of the artifact directories.
          # The Windows artifact in particular is a dir tree of Qt DLLs +
          # the .exe(s); a naive find-everything-flatten uploaded 50+
          # extraneous files (Qt6Core.dll, MSVCP140.dll, *.qml, …) before.
          for pat in '*.exe' '*.AppImage' '*.dmg' '*.apk' '*.tar.gz'; do
            find artifacts/ -type f -name "$pat" -exec cp -v {} release-files/ \;
          done
          cd release-files && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist; then upload (clobber existing assets of same name)
          if ! gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ steps.tag.outputs.tag }}" \
              --title "Electrum-MEWC ${{ steps.tag.outputs.tag }}" \
              --generate-notes
          fi
          gh release upload "${{ steps.tag.outputs.tag }}" release-files/* --clobber
